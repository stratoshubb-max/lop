{% load static %}
<!doctype html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fbf9f4">
    <meta name="csrf-token" content="{{ csrf_token_value }}">
    <meta name="auth-status" content="{{ authenticated|yesno:'true,false' }}">
    <title>Account Not Found — Athar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'core/css/site.css' %}?v=20">
</head>
<body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="{% url 'core:home' %}" aria-label="Athar Home">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 32 32" fill="none"><path d="M7.5 21.6c1.8-5.9 5.9-10 11.9-11.9 1.1-.3 2.2-.6 3.3-.7-1.3 1.1-2.2 2.5-2.7 4.1-1.2 3.8-3.5 6.6-7 8.4-1.7.8-3.5 1-5.5.1Z" fill="currentColor"/><path d="M8 25.2c4.9-1.1 9.4-3.6 13.3-7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                </span>
                <span class="brand-copy"><strong>Athar</strong><small>Your quiet space</small></span>
            </a>
            <div class="topbar-actions">
                <a href="{% url 'core:home' %}" class="header-auth-link">← Feed</a>
            </div>
        </div>
    </header>

    <main class="site-main">
        <div class="profile-not-found-card">
            <span class="not-found-icon">🔍</span>
            <h2>This account doesn't exist</h2>
            <p>Try searching for another handle or voice on Athar.</p>
            <a href="{% url 'core:home' %}" class="btn-primary">Back to Home</a>
        </div>
    </main>

    <script src="{% static 'core/js/site.js' %}?v=16"></script>
</body>
</html>
