<div class="search-layer" id="searchLayer" hidden>
    <div class="search-backdrop" data-close-search></div>
    <section class="search-panel" role="dialog" aria-modal="true" aria-labelledby="searchTitle">
        <div class="search-panel-heading">
            <span class="section-label" id="searchTitle">Search Athar</span>
            <button type="button" class="close-button" data-close-search aria-label="Close search">×</button>
        </div>
        <div class="search-input-wrap">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.4" stroke="currentColor" stroke-width="1.7"/><path d="m16 16 4.2 4.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            <input id="searchInput" type="search" placeholder="Try: design, philosophy, or a name…" autocomplete="off">
            <kbd class="search-kbd">esc</kbd>
        </div>
        <p class="search-hint" id="searchHint">Search thoughts, people and topics in real time.</p>
        <div class="search-insight" id="searchInsight" hidden></div>
        <div class="search-results" id="searchResults"></div>
    </section>
</div>
