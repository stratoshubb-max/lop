<header class="topbar">
    <div class="topbar-inner">
        <a class="brand" href="{% url 'core:home' %}" aria-label="Athar Home">
            <span class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 32 32" fill="none">
                    <path d="M7.5 21.6c1.8-5.9 5.9-10 11.9-11.9 1.1-.3 2.2-.6 3.3-.7-1.3 1.1-2.2 2.5-2.7 4.1-1.2 3.8-3.5 6.6-7 8.4-1.7.8-3.5 1-5.5.1Z" fill="currentColor"/>
                    <path d="M8 25.2c4.9-1.1 9.4-3.6 13.3-7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
            </span>
            <span class="brand-copy">
                <strong>Athar</strong>
                <small>Your quiet space</small>
            </span>
        </a>

        <div class="topbar-search" role="search">
            <button class="topbar-search-button" id="searchTrigger" type="button" aria-label="Search Athar">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.4" stroke="currentColor" stroke-width="1.7"/><path d="m16 16 4.2 4.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
                <span>Search thoughts, people, topics</span>
                <kbd>/</kbd>
            </button>
        </div>

        <div class="topbar-actions">
            <button class="icon-button" id="aiTrigger" type="button" aria-label="Ask the Athar assistant" title="Athar assistant">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3.5l1.6 4.2 4.2 1.6-4.2 1.6L12 15l-1.6-4.1L6.2 9.3l4.2-1.6L12 3.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M18.5 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8.8-2Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
            </button>
            <button class="icon-button settings-trigger" type="button" data-open-website-settings aria-label="Settings">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" stroke="currentColor" stroke-width="1.6"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            {% if authenticated %}
            <button class="header-cta" type="button" data-open-composer>New Thought <span>↓</span></button>
            <a class="header-account" href="/u/{{ viewer.handle }}/" title="@{{ viewer.handle }}">
                <span class="avatar avatar-tiny tone-{{ viewer.avatar_tone }}{% if viewer.avatar_url %} has-photo{% endif %}">
                    {% if viewer.avatar_url %}<img src="{{ viewer.avatar_url }}" alt="{{ viewer.display_name }}">{% else %}{{ viewer.avatar_initial }}{% endif %}
                </span>
                <span class="header-account-name">{{ viewer.display_name }}</span>
            </a>
            {% else %}
            <button class="header-auth-link" type="button" data-open-auth data-auth-mode="login">Sign In</button>
            <button class="header-cta" type="button" data-open-auth data-auth-mode="register">Join Athar <span>↓</span></button>
            {% endif %}
        </div>
    </div>
</header>
