<div class="modal-layer confirm-layer is-hidden" id="confirmLayer" style="display:none;" hidden>
    <div class="modal-backdrop" data-confirm-cancel></div>
    <section class="confirm-card" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmBody">
        <span class="section-label">Please confirm</span>
        <h2 id="confirmTitle">Delete this thought?</h2>
        <p id="confirmBody">This cannot be undone.</p>
        <div class="confirm-actions">
            <button type="button" class="btn-ghost" data-confirm-cancel>Keep it</button>
            <button type="button" class="btn-danger" id="confirmAccept" data-confirm-accept>Delete</button>
        </div>
    </section>
</div>
